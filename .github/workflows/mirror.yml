on:
  push:
    branches:
      - 'main'

jobs:
  mirror_job:
    runs-on: ubuntu-latest
    name: Mirror main branch to staging branch
    permissions:
      contents: write
    steps:
      - name: Point staging at main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
            const sha = main.object.sha;
            try {
              await github.rest.git.updateRef({ owner, repo, ref: "heads/staging", sha, force: true });
            } catch (error) {
              // 422 "Reference does not exist": staging hasn't been created yet.
              if (error.status !== 422) {
                throw error;
              }
              await github.rest.git.createRef({ owner, repo, ref: "refs/heads/staging", sha });
            }
            console.log(`Set staging to ${sha}.`);
